name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install ant
        run: sudo apt-get update && sudo apt-get install -y ant ant-optional
      - name: Build and test
        # javadoc runs the doctests, and test runs the JUnit tests and
        # reruns the doctests which javadoc wrote out
        run: ant clean javadoc test
      - name: Build release artifacts
        if: matrix.java == 21
        run: ant release -Dskip.sign=true
      - uses: actions/upload-artifact@v4
        if: matrix.java == 21
        with:
          name: jutil-unsigned
          path: |
            jutil-*.jar
            jutil-*.tar.gz
            jutil-*-bundle.zip
